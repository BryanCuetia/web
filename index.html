<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bryan Cuetia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --ink: #15161B;
    --accent: #F5F2EB;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ 
    scroll-behavior:smooth;
    overflow-x: hidden;
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  a{ color:inherit; text-decoration:none; }

  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  .hero{
    position:relative;
    width:100vw;
    height: 110vh;
    overflow: hidden;
    /* Fondo actualizado con la imagen proporcionada */
    background-image: url('Bryan.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  .hero-content{
    position: fixed;
    top: 0;
    left: 0;
    z-index:2;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    height:100vh;
    width:100%;
    padding: 2.5rem 3rem 1.4rem 3rem;
  }

  .name{
    font-family: 'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 0.92;
    font-size: clamp(1.5rem, 2.3vw, 2.1rem);
    letter-spacing: 0.06em;
    color: #F5F2EB;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    margin-top: -0.2rem;
    margin-left: 0;
    display: inline-block;
  }

  .name a{
    display: inline-block;
    color: inherit;
    text-decoration: none;
    transition: opacity 0.2s ease;
    cursor: pointer;
  }

  .name a:hover{ opacity: 0.8; }

  .hero-bottom{
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    width:100%;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s ease;
  }

  .hero-bottom.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  /* Iconos sociales de escritorio (horizontales) */
  .socials-mini{
    display:flex;
    gap: 1.2rem;
    align-items:center;
    z-index: 2;
    margin-left: 0;
  }

  .socials-mini a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 12px;
    height: 12px;
    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    fill: none;          
    stroke: #F5F2EB;     
    stroke-width: 1.6px; 
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
  }

  .socials-mini a:hover {
    background: transparent;
    transform: translateY(-2px);
    opacity: 0.7;
    border-color: transparent;
  }

  .socials-mini a svg {
    width: 100%;
    height: 100%;
  }

  .socials-mini a:hover svg,
  .socials-mini a:hover svg path,
  .socials-mini a:hover svg rect,
  .socials-mini a:hover svg polygon {
    stroke: #F5F2EB !important;
    fill: none !important;
  }

  .socials-mini a svg[viewBox="0 0 24 24"] rect {
      fill: none;
      stroke: #F5F2EB;
  }

  /* Copyright de escritorio */
  .copyright{
    position: relative;
    right: auto;
    bottom: auto;
    font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.45rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #F5F2EB;
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: none;
    height: auto;
    display: flex;
    align-items: center;
    padding: 0;
    border-radius: 0;
    box-shadow: none;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    opacity: 1;
    text-align: right;
    white-space: nowrap;
    z-index: 1;
  }

  /* ---------- RESPONSIVE MÓVIL ---------- */
  @media (max-width: 640px){
    .hero{ 
      height: 115vh; 
      min-height: 115vh; 
      overflow: visible;
      background-size: cover;
      background-position: center;
    }
    .hero-content{ position: relative; height: 115vh; min-height: 115vh; justify-content: space-between; gap: 0; padding: 2rem 1.5rem calc(1.2rem + env(safe-area-inset-bottom, 0px)) 1.5rem; align-items: center; text-align: center; }
    
    .name{ 
      font-family: 'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 9vw, 3.2rem); 
      line-height: 1;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 0;
      margin-left: 0;
      position: relative;
      top: 0;
      text-align: center;
      width: 100%;
      color: #F5F2EB;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
    }
    
    .hero-bottom{ 
      position: fixed;
      bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      padding: 0 1.5rem;
      margin-top: 0; 
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      gap: 0.8rem; 
      width: 100%;
      z-index: 10;
    }

    .socials-mini{ gap: 1.2rem; justify-content: center; margin-left: 0; }
    .socials-mini a { width: 13px; height: 13px; }

    .copyright{
      position: static;
      transform: none;
      font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.42rem;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-align: center;
      margin-bottom: 0;
      color: #F5F2EB;
      background: transparent;
      border: none;
      height: auto;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    }
  }
</style>
</head>
<body id="top">

  <header class="hero" id="heroSection">
    <!-- Se ha reemplazado el elemento video por la imagen de fondo Bryan.jpg -->

    <div class="hero-content">
      <h1 class="name">
        <a href="" onclick="window.location.reload(); return false;" aria-label="Recargar página y volver al inicio">
          <span>BRYAN CUETIA</span>
        </a>
      </h1>

      <div class="hero-bottom" id="heroBottom">
        <div class="socials-mini" aria-label="Redes sociales">
          <!-- Instagram -->
          <a href="https://instagram.com/bryancuetia" aria-label="Instagram" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
          </a>
          <!-- TikTok -->
          <a href="https://tiktok.com/@bryancuetia" aria-label="TikTok" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M16.6 5.8c-.9-.6-1.5-1.6-1.6-2.8h-3v12.6a2.6 2.6 0 1 1-2.1-2.6v-3a5.6 5.6 0 1 0 5.1 5.6V9.7c1 .7 2.2 1.1 3.6 1.1V7.8c-.7 0-1.4-.2-2-.6z"/></svg>
          </a>
          <!-- Facebook -->
          <a href="https://facebook.com/bryancuetia" aria-label="Facebook" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
          </a>
          <!-- X -->
          <a href="https://x.com/bryancuetia" aria-label="X" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </a>
          <!-- YouTube -->
          <a href="https://youtube.com/@bryancuetia" aria-label="YouTube" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02" fill="#F5F2EB"/></svg>
          </a>
        </div>
        <div class="copyright">
          © 2026 BRYAN CUETIA
        </div>
      </div>
    </div>
  </header>

  <script>
    let targetScrollY = window.scrollY;
    let currentScrollY = window.scrollY;
    let isScrolling = false;
    const speedFactor = 0.08; 
    const heroBottom = document.getElementById('heroBottom');

    function updateScrollState() {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (currentScrollY >= maxScroll - 2) {
        heroBottom.classList.add('show');
      } else {
        heroBottom.classList.remove('show');
      }
    }

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      targetScrollY += e.deltaY * 0.25;
      
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      targetScrollY = Math.max(0, Math.min(targetScrollY, maxScroll));
      
      if (!isScrolling) {
        requestAnimationFrame(smoothScrollLoop);
      }
    }, { passive: false });

    function smoothScrollLoop() {
      isScrolling = true;
      currentScrollY += (targetScrollY - currentScrollY) * speedFactor;
      window.scrollTo(0, currentScrollY);
      updateScrollState();
      if (Math.abs(targetScrollY - currentScrollY) > 0.5) {
        requestAnimationFrame(smoothScrollLoop);
      } else {
        isScrolling = false;
        updateScrollState();
      }
    }

    window.addEventListener('scroll', () => {
      if (!isScrolling) {
        targetScrollY = window.scrollY;
        currentScrollY = window.scrollY;
        updateScrollState();
      }
    });
  </script>
</body>
</html>
