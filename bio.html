<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIO — Bryan Cuetia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400&family=Lora:wght@600&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ background:#000000; }
  body{
    min-height:100vh;
    min-height:100dvh;
    color:#EEEDE9;
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.72) 0%, rgba(0,0,0,.86) 55%, #000000 100%),
      url('Bryan.jpg') center / cover no-repeat,
      #000000;
  }
  a{ color:inherit; text-decoration:none; }
  :focus-visible{ outline:2px solid #EEEDE9; outline-offset:3px; }

  .page{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:2.3rem 3rem calc(1.4rem + env(safe-area-inset-bottom, 0px));
  }

  /* Cabecera: mismo título y menú que la página principal */
  .brand{
    display:inline-block;
    font-family:'Lora', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:clamp(1.6rem, 2.95vw, 3.1rem);
    line-height:1;
    text-transform:uppercase;
    letter-spacing:.08em;
    padding-left:.08em;
    color:#EEEDE9;
    text-shadow:0 3px 8px rgba(0,0,0,.35);
    text-align:center;
    transition:opacity .2s ease;
  }
  .brand:hover{ opacity:.8; }

  .site-nav{ margin-top:clamp(0.9rem, 1.55vw, 1.5rem); }
  .site-nav ul{ list-style:none; display:flex; justify-content:center; align-items:center; }
  .site-nav li{
    display:flex; align-items:center;
    font-family:'Lora', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:clamp(0.8rem, 1.32vw, 1.25rem);
    line-height:1;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#EEEDE9;
    text-shadow:0 3px 8px rgba(0,0,0,.35);
  }
  .site-nav li + li::before{
    content:"|";
    content:"|" / "";
    margin:0 1.05em 0 calc(1.05em - .08em);
    font-weight:400;
    opacity:.85;
  }
  .site-nav a{
    display:inline-block;
    padding:.35em 0 .3em;
    color:inherit;
    background:linear-gradient(currentColor,currentColor) left calc(100% - .12em) / 0 1px no-repeat;
    transition:background-size .35s ease;
  }
  .site-nav a:hover,
  .site-nav a:focus-visible,
  .site-nav a[aria-current="page"]{ background-size:100% 1px; }

  /* Contenido (reservado para el contenido definitivo) */
  .content{
    flex:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2rem 0;
  }
  .construction{ animation:rise 1.6s cubic-bezier(0.16,1,0.3,1) .2s both; }
  .eyebrow{
    font-family:'Lato','Helvetica Neue',Arial,sans-serif;
    font-size:clamp(0.75rem, 1.05vw, 0.95rem);
    letter-spacing:.32em;
    padding-left:.32em;
    color:#C9C7C2;
    margin-bottom:1.4rem;
  }
  .construction h1{
    font-family:'Lora', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:clamp(1.7rem, 4.2vw, 3.6rem);
    line-height:1.1;
    letter-spacing:.14em;
    padding-left:.14em;
    text-transform:uppercase;
    text-shadow:0 3px 8px rgba(0,0,0,.35);
  }
  .rule{
    display:block;
    width:clamp(2.5rem, 5vw, 4rem);
    height:1px;
    background:#B4B3AF;
    opacity:.7;
    margin:1.8rem auto;
  }
  .note{
    font-family:'Lato','Helvetica Neue',Arial,sans-serif;
    font-size:clamp(0.8rem, 1.1vw, 1rem);
    letter-spacing:.08em;
    line-height:1.7;
    color:#CFCDC8;
    max-width:32ch;
    margin:0 auto;
  }

  .foot{
    font-family:'Lato','Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    letter-spacing:.09em;
    line-height:1;
    text-transform:uppercase;
    color:#CFCDC8;
    text-align:center;
  }

  .fade-in{ animation:rise 1.4s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes rise{
    from{ opacity:0; transform:translate3d(0,18px,0); filter:blur(6px); }
    to{ opacity:1; transform:translate3d(0,0,0); filter:blur(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .construction, .fade-in{ animation:none; }
  }

  @media (max-width:640px){
    .page{ padding:2rem 1.5rem calc(1.2rem + env(safe-area-inset-bottom, 0px)); }
    .brand{ font-size:clamp(1.5rem, 8vw, 3.2rem); width:100%; }
    .site-nav{ margin-top:.9rem; }
    .site-nav li{ font-size:clamp(0.72rem, 3.6vw, 1rem); }
    .construction h1{ font-size:clamp(1.5rem, 8vw, 2.2rem); letter-spacing:.1em; padding-left:.1em; }
    .foot{ font-size:10px; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="fade-in">
      <a class="brand" href="in.html" aria-label="Volver a la página principal" onclick="try{ sessionStorage.setItem('skipWelcomeScreen','1'); }catch(e){}">Bryan Cuetia</a>
      <nav class="site-nav" aria-label="Navegación principal">
        <ul>
          <li><a href="in.html" onclick="try{ sessionStorage.setItem('instantHome','1'); }catch(e){}">Inicio</a></li>
          <li><a href="bio.html" aria-current="page">Bio</a></li>
          <li><a href="shop.html">Shop</a></li>
        </ul>
      </nav>
    </header>

    <main class="content">
      <!-- bio-content: sustituir este bloque por el contenido definitivo de BIO -->
      <section class="construction" id="bio-content">
        <p class="eyebrow">BIO</p>
        <h1>En construcción</h1>
        <span class="rule" aria-hidden="true"></span>
        <p class="note">Estamos preparando esta sección. Muy pronto estará disponible.</p>
      </section>
    </main>

    <footer class="foot">© 2026 BRYAN CUETIA</footer>
  </div>
</body>
</html>
