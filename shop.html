<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHOP - BRYAN CUETIA</title>
<meta name="description" content="Tienda oficial de Bryan Cuetia">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Ctext x='32' y='48' font-family='Helvetica, Arial, sans-serif' font-weight='700' font-size='42' fill='%23FFFFFF' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400&family=Lora:wght@600&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ background:#000000; }
  body{
    min-height:100vh;
    min-height:100dvh;
    color:#EEEDE9;
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.72) 0%, rgba(0,0,0,.86) 55%, #000000 100%),
      url('Bryan.jpg') center / cover no-repeat,
      #000000;
  }
  a{ color:inherit; text-decoration:none; }
  :focus-visible{ outline:2px solid #EEEDE9; outline-offset:3px; }

  .page{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:2.3rem 3rem calc(1.4rem + env(safe-area-inset-bottom, 0px));
  }

  /* Cabecera: mismo título y menú que la página principal */
  .brand{
    display:inline-block;
    font-family:'Lora', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:clamp(1.6rem, 2.95vw, 3.1rem);
    line-height:1;
    text-transform:uppercase;
    letter-spacing:.08em;
    padding-left:.08em;
    color:#EEEDE9;
    text-shadow:0 3px 8px rgba(0,0,0,.35);
    text-align:center;
    transition:opacity .2s ease;
  }
  .brand:hover{ opacity:.8; }

  .site-nav{ margin-top:clamp(0.9rem, 1.55vw, 1.5rem); }
  .site-nav ul{ list-style:none; display:flex; justify-content:center; align-items:center; }
  .site-nav li{
    display:flex; align-items:center;
    font-family:'Lora', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:clamp(0.8rem, 1.32vw, 1.25rem);
    line-height:1;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#EEEDE9;
    text-shadow:0 3px 8px rgba(0,0,0,.35);
  }
  .site-nav li + li::before{
    content:"|";
    content:"|" / "";
    margin:0 1.05em 0 calc(1.05em - .08em);
    font-weight:400;
    opacity:.85;
  }
  .site-nav a{
    display:inline-block;
    padding:.35em 0 .3em;
    color:inherit;
    background:linear-gradient(currentColor,currentColor) left calc(100% - .12em) / 0 1px no-repeat;
    transition:background-size .35s ease;
  }
  .site-nav a:hover,
  .site-nav a:focus-visible,
  .site-nav a[aria-current="page"]{ background-size:100% 1px; }

  /* Contenido (reservado para el contenido definitivo) */
  .content{
    flex:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2rem 0;
  }
  .construction{ animation:rise 1.6s cubic-bezier(0.16,1,0.3,1) .2s both; }
  .eyebrow{
    font-family:'Lato','Helvetica Neue',Arial,sans-serif;
    font-size:clamp(0.75rem, 1.05vw, 0.95rem);
    letter-spacing:.32em;
    padding-left:.32em;
    color:#C9C7C2;
    margin-bottom:1.4rem;
  }
  .construction h1{
    font-family:'Lora', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:clamp(1.7rem, 4.2vw, 3.6rem);
    line-height:1.1;
    letter-spacing:.14em;
    padding-left:.14em;
    text-transform:uppercase;
    text-shadow:0 3px 8px rgba(0,0,0,.35);
  }
  .rule{
    display:block;
    width:clamp(2.5rem, 5vw, 4rem);
    height:1px;
    background:#B4B3AF;
    opacity:.7;
    margin:1.8rem auto;
  }
  .note{
    font-family:'Lato','Helvetica Neue',Arial,sans-serif;
    font-size:clamp(0.8rem, 1.1vw, 1rem);
    letter-spacing:.08em;
    line-height:1.7;
    color:#CFCDC8;
    max-width:32ch;
    margin:0 auto;
  }

  .foot{
    font-family:'Lato','Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    letter-spacing:.09em;
    line-height:1;
    text-transform:uppercase;
    color:#CFCDC8;
    text-align:center;
  }

  .fade-in{ animation:rise 1.4s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes rise{
    from{ opacity:0; transform:translate3d(0,18px,0); filter:blur(6px); }
    to{ opacity:1; transform:translate3d(0,0,0); filter:blur(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .construction, .fade-in{ animation:none; }
  }

  @media (max-width:640px){
    .page{ padding:2rem 1.5rem calc(1.2rem + env(safe-area-inset-bottom, 0px)); }
    .brand{ font-size:clamp(1.5rem, 8vw, 3.2rem); width:100%; }
    .site-nav{ margin-top:.9rem; }
    .site-nav li{ font-size:clamp(0.72rem, 3.6vw, 1rem); }
    .construction h1{ font-size:clamp(1.5rem, 8vw, 2.2rem); letter-spacing:.1em; padding-left:.1em; }
    .foot{ font-size:10px; }
  }

  /* Escritorio: título y menú con el mismo tamaño y ubicación que en la página principal */
  @media (min-width:641px){
    html{ overflow-y:scroll; }
    .page{ padding-top:2.5rem; }
    .brand{
      display:block;
      width:max-content;
      margin:0 auto;
    }
    .site-nav{ margin-top:calc(clamp(0.75rem, 1.2vw, 1.2rem) - 0.2rem); }
  }

  /* Iconos de redes sociales (idénticos a los de la página principal) */
  .socials-row{
    display:flex;
    justify-content:center;
    margin:0 0 1.4rem;
  }
  .socials-mini{
    display:flex;
    gap:18px;
    align-items:center;
  }
  .socials-mini a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:16px;
    height:16px;
    background:transparent;
    border:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
    fill:none;
    stroke:#B4B3AF;
    stroke-width:1.5px;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .socials-mini a:hover{
    transform:translateY(-2px);
    opacity:0.7;
  }
  .socials-mini a svg{ width:100%; height:100%; }
  .socials-mini a:hover svg,
  .socials-mini a:hover svg path,
  .socials-mini a:hover svg rect,
  .socials-mini a:hover svg polygon{
    stroke:#B4B3AF !important;
    fill:none !important;
  }
  .socials-mini a svg[viewBox="0 0 24 24"] rect{ fill:none; stroke:#B4B3AF; }
  .socials-mini a[aria-label="Instagram"]{ order:1; }
  .socials-mini a[aria-label="Facebook"]{ order:2; }
  .socials-mini a[aria-label="TikTok"]{ order:3; }
  .socials-mini a[aria-label="X"]{ order:4; }
  .socials-mini a[aria-label="YouTube"]{ order:5; }
  .socials-mini a[aria-label="Apple Music"]{ order:6; }
</style>
</head>
<body>
  <div class="page">
    <header class="fade-in">
      <a class="brand" href="index.html" aria-label="Volver a la página principal" onclick="try{ sessionStorage.setItem('skipWelcomeScreen','1'); }catch(e){}">Bryan Cuetia</a>
      <nav class="site-nav" aria-label="Navegación principal">
        <ul>
          <li><a href="index.html" onclick="try{ sessionStorage.setItem('instantHome','1'); }catch(e){}">Inicio</a></li>
          <li><a href="bio.html">Bio</a></li>
          <li><a href="shop.html" aria-current="page">Shop</a></li>
        </ul>
      </nav>
    </header>

    <main class="content">
      <!-- shop-content: sustituir este bloque por el contenido definitivo de SHOP -->
      <section class="construction" id="shop-content">
        <p class="eyebrow">SHOP</p>
        <h1>En construcción</h1>
        <span class="rule" aria-hidden="true"></span>
        <p class="note">Estamos preparando esta sección. Muy pronto estará disponible.</p>
      </section>
    </main>

    <div class="socials-row">
      <div class="socials-mini" aria-label="Redes sociales">
        <!-- Instagram -->
        <a href="https://instagram.com/bryancuetia" aria-label="Instagram" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>

        </a>
        <!-- X -->
        <a href="https://x.com/bryancuetia" aria-label="X" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
        <!-- YouTube -->

        <!-- Apple Music -->
        <a href="https://music.apple.com/profile/bryancuetia" aria-label="Apple Music" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path stroke-linejoin="round" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>

      </div>
    </div>

    <footer class="foot">© 2026 BRYAN CUETIA</footer>
  </div>
</body>
</html>
