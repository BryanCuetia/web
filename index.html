<!DOCTYPE html>
<html lang="es" class="preloader-active title-pending">
<head>
<script>
  /* Regreso directo desde INICIO (BIO/SHOP): sin preloader, bienvenida ni efectos de ingreso */
  (function(){
    try{
      if (sessionStorage.getItem('instantHome') === '1'){
        sessionStorage.removeItem('instantHome');
        sessionStorage.removeItem('skipWelcomeScreen');
        var h = document.documentElement;
        h.classList.add('instant-home');
        h.classList.remove('preloader-active');
        h.classList.remove('title-pending');
      }
    }catch(e){}
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRYAN CUETIA</title>
<meta name="description" content="Sitio web oficial de Bryan Cuetia">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Ctext x='32' y='48' font-family='Helvetica, Arial, sans-serif' font-weight='700' font-size='42' fill='%23FFFFFF' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Lora:ital,wght@0,600;1,400&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --ink: #15161B;
    --accent: #F5F2EB;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ 
    scroll-behavior:smooth;
    overflow-x: hidden;
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  a{ color:inherit; text-decoration:none; }

  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  .hero{
    position:relative;
    width:100vw;
    height: 110vh;
    overflow: hidden;
    /* Fondo actualizado con la imagen proporcionada */
    background-image: url('Bryan.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  .hero-content{
    position: fixed;
    top: 0;
    left: 0;
    z-index:2;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    height:100vh;
    width:100%;
    padding: 2.5rem 3rem 1.4rem 3rem;
  }

  .name{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    text-transform: uppercase;
    line-height: 0.92;
    font-size: clamp(1.5rem, 2.3vw, 2.1rem);
    letter-spacing: clamp(0.08em, 2vw, 0.28em);
    color: #F5F2EB;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    margin-top: -0.2rem;
    margin-left: 0;
    display: inline-block;
  }

  .name a{
    display: inline-block;
    color: inherit;
    text-decoration: none;
    transition: opacity 0.2s ease;
    cursor: pointer;
  }

  .name a:hover{ opacity: 0.8; }

  .hero-bottom{
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    width:100%;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s ease;
  }

  .hero-bottom.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  /* Iconos sociales de escritorio (horizontales) */
  .socials-mini{
    display:flex;
    gap: 1.2rem;
    align-items:center;
    z-index: 2;
    margin-left: 0;
  }

  .socials-mini a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 12px;
    height: 12px;
    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    fill: none;          
    stroke: #F5F2EB;     
    stroke-width: 1.8px; 
    stroke-linecap: round;
    stroke-linejoin: round;
    filter:
      drop-shadow(0 0 1.5px rgba(0, 0, 0, 0.85))
      drop-shadow(0 1px 3px rgba(0, 0, 0, 0.75))
      drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
  }

  .socials-mini a:hover {
    background: transparent;
    transform: translateY(-2px);
    opacity: 0.7;
    border-color: transparent;
  }

  .socials-mini a svg {
    width: 100%;
    height: 100%;
  }

  .socials-mini a:hover svg,
  .socials-mini a:hover svg path,
  .socials-mini a:hover svg rect,
  .socials-mini a:hover svg polygon {
    stroke: #F5F2EB !important;
    fill: none !important;
  }

  .socials-mini a svg[viewBox="0 0 24 24"] rect {
      fill: none;
      stroke: #F5F2EB;
  }

  /* Copyright de escritorio */
  .copyright{
    position: relative;
    right: auto;
    bottom: auto;
    font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.45rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #F5F2EB;
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: none;
    height: auto;
    display: flex;
    align-items: center;
    padding: 0;
    border-radius: 0;
    box-shadow: none;
    text-shadow:
      0 0 1.5px rgba(0, 0, 0, 0.85),
      0 1px 3px rgba(0, 0, 0, 0.75),
      0 2px 6px rgba(0, 0, 0, 0.5);
    opacity: 1;
    text-align: right;
    white-space: nowrap;
    z-index: 1;
  }

  /* ---------- PRELOADER ---------- */
  html.preloader-active,
  body.preloader-active{
    overflow:hidden;
    height:100%;
  }

  #preloader{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#000000;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    transition: opacity 0.7s ease;
  }

  #preloader.preloader-hidden{
    opacity:0;
    pointer-events:none;
  }

  .preloader-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.1rem;
    padding:0 1.5rem;
  }

  .preloader-text{
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:#FFFFFF;
    font-size:clamp(1.1rem, 2.6vw, 1.75rem);
    text-align:center;
    white-space:nowrap;
  }

  .preloader-bar{
    width:0;
    height:1px;
    background:rgba(255,255,255,0.18);
    overflow:hidden;
  }

  .preloader-bar-fill{
    width:0%;
    height:100%;
    background:#FFFFFF;
    animation: preloaderLoad 2.2s cubic-bezier(0.65,0,0.35,1) forwards;
  }

  @keyframes preloaderLoad{
    from{ width:0%; }
    to{ width:100%; }
  }

  /* ---------- PANTALLA DE BIENVENIDA (NUEVA, insertada entre la carga y la página principal) ---------- */
  html.welcome-active,
  body.welcome-active{
    overflow:hidden;
    height:100%;
  }

  #welcomeScreen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#000000;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9998;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:none;
  }

  #welcomeScreen.welcome-show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }

  #welcomeScreen.welcome-hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition: opacity 0.8s cubic-bezier(0.65,0,0.35,1), visibility 0.8s;
  }

  .welcome-name-wrap{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.1rem; /* idéntico al gap de .preloader-content, para replicar su misma posición */
  }

  .welcome-spacer{
    width:0;
    height:1px; /* replica la altura de .preloader-bar para que el cálculo de centrado sea idéntico */
  }

  /* Mismo tamaño, tipografía y posición exacta que .preloader-text; sin transición ni animación alguna */
  .welcome-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:#FFFFFF;
    font-size:clamp(1.1rem, 2.6vw, 1.75rem);
    text-align:center;
    white-space:nowrap;
  }

  .welcome-btn{
    position:absolute;
    top:calc(50% + clamp(2.3rem, 4vw, 3.1rem));
    left:50%;
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:#FFFFFF;
    background:transparent;
    border:1px solid #FFFFFF;
    border-radius:10px;
    padding:0.85em 2.4em;
    font-size:clamp(0.62rem, 1.05vw, 0.72rem);
    cursor:pointer;
    opacity:0;
    transform:translate(-50%,10px);
    transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1) 1.05s, transform 0.7s cubic-bezier(0.16,1,0.3,1) 1.05s, background-color 0.3s ease, color 0.3s ease;
  }

  #welcomeScreen.welcome-show .welcome-btn{
    opacity:1;
    transform:translate(-50%,0);
  }

  .welcome-btn:hover,
  .welcome-btn:focus-visible{
    background:#FFFFFF;
    color:#000000;
  }

  @media (max-width:640px){
    .welcome-btn{ padding:0.78em 2rem; font-size:clamp(0.58rem, 2.4vw, 0.68rem); }
  }

  /* ---------- RESPONSIVE MÓVIL ---------- */
  @media (max-width: 640px){
    .hero{ 
      height: 115vh; 
      min-height: 115vh; 
      overflow: visible;
      background-size: cover;
      background-position: center;
    }
    .hero-content{ position: relative; height: 115vh; min-height: 115vh; justify-content: space-between; gap: 0; padding: 2rem 1.5rem calc(1.2rem + env(safe-area-inset-bottom, 0px)) 1.5rem; align-items: center; text-align: center; }
    
    .name{ 
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      font-size: clamp(1.5rem, 8vw, 3.2rem); 
      line-height: 1;
      letter-spacing: clamp(0.05em, 1.6vw, 0.28em);
      text-transform: uppercase;
      margin-top: 0;
      margin-left: 0;
      position: relative;
      top: 0;
      text-align: center;
      width: 100%;
      color: #F5F2EB;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
    }
    
    .hero-bottom{ 
      position: fixed;
      bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      padding: 0 1.5rem;
      margin-top: 0; 
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      gap: 0.8rem; 
      width: 100%;
      z-index: 10;
    }

    .socials-mini{ gap: 1.2rem; justify-content: center; margin-left: 0; }
    .socials-mini a {
      width: 13px;
      height: 13px;
      stroke-width: 1.8px;
      filter:
        drop-shadow(0 0 1.5px rgba(0, 0, 0, 0.85))
        drop-shadow(0 1px 3px rgba(0, 0, 0, 0.75))
        drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
    }

    .copyright{
      position: static;
      transform: none;
      font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.42rem;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-align: center;
      margin-bottom: 0;
      color: #F5F2EB;
      background: transparent;
      border: none;
      height: auto;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      text-shadow:
        0 0 1.5px rgba(0, 0, 0, 0.85),
        0 1px 3px rgba(0, 0, 0, 0.75),
        0 2px 6px rgba(0, 0, 0, 0.5);
    }
  }

  /* =====================================================================
     AJUSTES VISUALES (referencia): título, fotografía, iconos y copyright
     ===================================================================== */

  /* Fotografía: fondo negro puro + transición inferior difuminada (edge bleeding) */
  .hero{ background-color:#000000; }
  .hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:55%;
    z-index:1;
    pointer-events:none;
    background:linear-gradient(to bottom,
      rgba(0,0,0,0)    0%,
      rgba(0,0,0,.03) 10%,
      rgba(0,0,0,.10) 22%,
      rgba(0,0,0,.22) 35%,
      rgba(0,0,0,.38) 48%,
      rgba(0,0,0,.58) 62%,
      rgba(0,0,0,.78) 76%,
      rgba(0,0,0,.92) 88%,
      #000000         96%,
      #000000        100%);
  }

  /* Título: centrado horizontal, misma ubicación/estilo que la referencia */
  .hero-content{ align-items:center; }
  .name{
    --name-ls: .08em;
    font-family:'Lora', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:clamp(1.6rem, 2.95vw, 3.1rem);
    line-height:1;
    letter-spacing:var(--name-ls);
    padding-left:var(--name-ls);      /* compensa el espaciado final para un centrado exacto */
    color:#EEEDE9;
    text-shadow:0 3px 8px rgba(0,0,0,.35);
    text-align:center;
    margin:0;
    align-self:center;
    max-width:100%;
  }

  /* Iconos sociales: 14px, trazo fino, gris, sin sombra, separación de 20px */
  .socials-mini{ gap:18px; }
  .socials-mini a{
    width:16px; height:16px;
    stroke:#B4B3AF;
    stroke-width:1.5px;
    filter:none;
  }
  .socials-mini a svg[viewBox="0 0 24 24"] rect{ stroke:#B4B3AF; }
  .socials-mini a[aria-label="Instagram"]{ order:1; }
  .socials-mini a[aria-label="Facebook"]{ order:2; }
  .socials-mini a[aria-label="TikTok"]{ order:3; }
  .socials-mini a[aria-label="X"]{ order:4; }
  .socials-mini a[aria-label="YouTube"]{ order:5; }
  .socials-mini a[aria-label="Apple Music"]{ order:6; }

  /* Redes y copyright alineados verticalmente al centro, como en la referencia */
  .hero-bottom{ align-items:center; }

  /* Copyright: 11px, mayúsculas, espaciado amplio, gris claro, sin sombra */
  .copyright{
    font-family:'Lato','Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    font-weight:400;
    letter-spacing:.09em;
    line-height:1;
    color:#CFCDC8;
    text-shadow:none;
  }

  @media (max-width:640px){
    .hero-content{ align-items:center; }
    .name{
      font-size:clamp(1.5rem, 8vw, 3.2rem);
      letter-spacing:var(--name-ls);
      padding-left:var(--name-ls);
      width:100%;
      color:#EEEDE9;
      text-shadow:0 3px 8px rgba(0,0,0,.35);
    }
    .hero-bottom{ align-items:center; }
    .socials-mini{ gap:18px; }
    .socials-mini a{ width:16px; height:16px; stroke-width:1.5px; filter:none; }
    .copyright{ font-size:10px; letter-spacing:.09em; color:#CFCDC8; text-shadow:none; }
  }

  /* ---------- SECUENCIA DE APARICIÓN DEL TÍTULO (después de "Iniciar") ---------- */
  html.title-pending .name{ opacity:0; visibility:hidden; }

  .name.name-reveal{
    animation: nameReveal 1.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    will-change: opacity, transform, filter;
  }

  @keyframes nameReveal{
    0%   { opacity:0; transform: translate3d(0, 26px, 0) scale(0.94); filter: blur(10px); }
    55%  { filter: blur(2px); }
    100% { opacity:1; transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .name.name-reveal{ animation: nameRevealSoft 1.2s ease both; }
    @keyframes nameRevealSoft{ from{ opacity:0; } to{ opacity:1; } }
  }

  /* =====================================================================
     MENÚ DE NAVEGACIÓN + CTA "SEGUIR EXPLORANDO"
     ===================================================================== */
  .hero-content{
    --title-fs: clamp(1.6rem, 2.95vw, 3.1rem);
    --title-top: 2.3rem;
    --nav-gap: clamp(0.75rem, 1.2vw, 1.2rem);
  }

  .site-nav{
    position:absolute;
    left:0; right:0;
    top: calc(var(--title-top) + var(--title-fs) + var(--nav-gap));
    z-index:3;
  }
  .site-nav ul{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:nowrap;
  }
  .site-nav li{
    display:flex;
    align-items:center;
    font-family:'Lora', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:clamp(0.8rem, 1.32vw, 1.25rem);
    line-height:1;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#EEEDE9;
    text-shadow:0 3px 8px rgba(0,0,0,.35);
  }
  .site-nav li + li::before{
    content:"|";
    content:"|" / "";
    margin:0 1.05em 0 calc(1.05em - .08em);
    font-weight:400;
    opacity:.85;
  }
  .site-nav a{
    display:inline-block;
    padding:.35em 0 .3em;
    color:inherit;
    background:linear-gradient(currentColor,currentColor) left calc(100% - .12em) / 0 1px no-repeat;
    transition:background-size .35s ease, opacity .25s ease, text-shadow .5s ease;
  }
  .site-nav a:hover,
  .site-nav a:focus-visible{ background-size:100% 1px; text-shadow:0 0 14px rgba(224,219,245,.55); }

  .scroll-cta{
    position:absolute;
    left:0; right:0;
    bottom:clamp(3.6rem, 9.5vh, 6rem);
    margin:0 auto;
    width:max-content;
    max-width:100%;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.7rem;
    padding:.4rem .8rem;
    background:none;
    border:0;
    cursor:pointer;
    color:#C9C7C2;
    font-family:'Lato','Helvetica Neue',Arial,sans-serif;
    font-weight:400;
    font-size:clamp(0.78rem, 1.1vw, 1.05rem);
    letter-spacing:.12em;
    line-height:1;
    text-transform:uppercase;
    text-shadow:0 1px 6px rgba(0,0,0,.45);
    transition:color .3s ease;
  }
  .scroll-cta svg{
    width:30px; height:14px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.4;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:transform .3s ease;
  }
  .scroll-cta:hover,
  .scroll-cta:focus-visible{ color:#FFFFFF; }
  .scroll-cta:hover svg{ transform:translateY(3px); }

  /* Aparición: después del título (misma secuencia fondo → título → menú → CTA) */
  html.title-pending .site-nav,
  html.title-pending .scroll-cta{ opacity:0; visibility:hidden; }
  html:not(.title-pending) .site-nav{ animation:navIn 1.5s cubic-bezier(0.16,1,0.3,1) .55s both; }
  html:not(.title-pending) .scroll-cta{ animation:navIn 1.5s cubic-bezier(0.16,1,0.3,1) 1.05s both; }
  html:not(.title-pending) .scroll-cta svg{ animation:ctaBob 2.8s ease-in-out 2.6s infinite; }

  @keyframes navIn{
    from{ opacity:0; transform:translate3d(0,14px,0); filter:blur(4px); }
    to{ opacity:1; transform:translate3d(0,0,0); filter:blur(0); }
  }
  @keyframes ctaBob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(5px); }
  }
  @media (prefers-reduced-motion: reduce){
    html:not(.title-pending) .site-nav,
    html:not(.title-pending) .scroll-cta{ animation:nameRevealSoft 1.2s ease both; }
    html:not(.title-pending) .scroll-cta svg{ animation:none; }
  }

  @media (max-width:640px){
    .hero-content{
      --title-fs: clamp(1.5rem, 8vw, 3.2rem);
      --title-top: 2rem;
      --nav-gap: .9rem;
    }
    .site-nav li{ font-size:clamp(0.72rem, 3.6vw, 1rem); }
    .scroll-cta{
      position:fixed;
      bottom:calc(6.2rem + env(safe-area-inset-bottom, 0px));
      font-size:clamp(0.72rem, 3.4vw, 0.9rem);
    }
  }

  /* Regreso directo desde INICIO: muestra la página principal completa de inmediato */
  html.instant-home #preloader,
  html.instant-home #welcomeScreen{ display:none !important; }
  html.instant-home .name,
  html.instant-home .site-nav,
  html.instant-home .scroll-cta{
    animation:none !important;
    opacity:1 !important;
    visibility:visible !important;
    transform:none !important;
    filter:none !important;
  }

  /* Desaparición del CTA una vez completado su scroll */
  html .scroll-cta.cta-fading{ pointer-events:none; }
  html .scroll-cta.cta-done{ opacity:0 !important; visibility:hidden !important; pointer-events:none; }

  /* Móvil: título y menú permanecen fijos durante todo el desplazamiento (como en escritorio) */
  @media (max-width:640px){
    .name{
      position:fixed;
      top:2rem;
      left:1.5rem;
      right:1.5rem;
      width:auto;
    }
    .site-nav{ position:fixed; }
  }

  /* ---------- FRASE DE CIERRE (aparece junto a redes y copyright al llegar al final) ---------- */
  .hero-phrase{
    position:fixed;
    left:3rem;
    bottom:calc(1.4rem + 16px + 1.4rem);
    z-index:2;

  .noche-dust:nth-child(6){ top:20%; left:12%; animation-duration:15s; animation-delay:-1s; }

  <script>
    (function(){
      var preloader = document.getElementById('preloader');
      var preloaderText = document.querySelector('.preloader-text');
      var preloaderBar = document.querySelector('.preloader-bar');
      var welcomeScreen = document.getElementById('welcomeScreen');
      var welcomeStartBtn = document.getElementById('welcomeStartBtn');
      var heroTitle = document.querySelector('.name');
      var TITLE_DELAY_AFTER_START = 1400; // 0.8s de transición + pausa breve con el fondo ya visible
      var titleShown = false;
      function revealTitle(){
        if (titleShown) return;
        titleShown = true;
        if (heroTitle) heroTitle.classList.add('name-reveal');
        document.documentElement.classList.remove('title-pending');
      }
      var PRELOAD_DURATION = 2200; // ms, matches preloader-bar-fill animation duration

      function syncBarWidth(){
        if (preloaderText && preloaderBar){
          preloaderBar.style.width = (preloaderText.getBoundingClientRect().width * 0.65) + 'px';
        }
      }

      var instantHome = document.documentElement.classList.contains('instant-home');
      if (instantHome){
        document.body.classList.remove('preloader-active');
        if (preloader && preloader.parentNode) preloader.parentNode.removeChild(preloader);
        if (welcomeScreen && welcomeScreen.parentNode) welcomeScreen.parentNode.removeChild(welcomeScreen);
      }

      syncBarWidth();
      window.addEventListener('resize', function(){
        if (preloader && preloader.parentNode){
          syncBarWidth();
        }
      });

      var skipWelcomeScreen = false;
      try {
        if (sessionStorage.getItem('skipWelcomeScreen') === '1'){
          skipWelcomeScreen = true;
          sessionStorage.removeItem('skipWelcomeScreen');
        }
      } catch(e){}

      function showWelcomeScreen(){
        if (!welcomeScreen) return;
        document.documentElement.classList.add('welcome-active');
        document.body.classList.add('welcome-active');
        welcomeScreen.classList.add('welcome-show');
      }

      function hidePreloader(){
        if (!preloader) return;
        preloader.classList.add('preloader-hidden');
        document.documentElement.classList.remove('preloader-active');
        document.body.classList.remove('preloader-active');
        if (!skipWelcomeScreen){
          showWelcomeScreen();
        } else {
          setTimeout(revealTitle, 1300);
        }
        setTimeout(function(){
          if (preloader && preloader.parentNode){
            preloader.parentNode.removeChild(preloader);
          }
        }, 700);
      }

      function goToMainSite(){
        if (!welcomeScreen) return;
        welcomeScreen.classList.remove('welcome-show');
        welcomeScreen.classList.add('welcome-hidden');
        document.documentElement.classList.remove('welcome-active');
        document.body.classList.remove('welcome-active');
        setTimeout(revealTitle, TITLE_DELAY_AFTER_START);
        setTimeout(function(){
          if (welcomeScreen && welcomeScreen.parentNode){
            welcomeScreen.parentNode.removeChild(welcomeScreen);
          }
        }, 900);
      }

      if (welcomeStartBtn){
        welcomeStartBtn.addEventListener('click', goToMainSite);
      }

      if (!instantHome){
        window.addEventListener('load', function(){
          setTimeout(hidePreloader, PRELOAD_DURATION);
        });
      }
    })();
  </script>

    function updateScrollState() {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (currentScrollY >= maxScroll - 2) {
        heroBottom.classList.add('show');
      } else {
        heroBottom.classList.remove('show');
      }
    }

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      targetScrollY += e.deltaY * 0.25;
      
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      targetScrollY = Math.max(0, Math.min(targetScrollY, maxScroll));
      
      if (!isScrolling) {
        requestAnimationFrame(smoothScrollLoop);
      }
    }, { passive: false });

    function smoothScrollLoop() {
      isScrolling = true;
      currentScrollY += (targetScrollY - currentScrollY) * speedFactor;
      window.scrollTo(0, currentScrollY);
      updateScrollState();
      if (Math.abs(targetScrollY - currentScrollY) > 0.5) {
        requestAnimationFrame(smoothScrollLoop);
      } else {
        isScrolling = false;
        updateScrollState();
      }
    }

    window.addEventListener('scroll', () => {
      if (!isScrolling) {
        targetScrollY = window.scrollY;
        currentScrollY = window.scrollY;
        updateScrollState();
      }
    });
  </script>

  <script>
    /* Menú (INICIO permanece en la página principal) y CTA de scroll suave */
    (function(){
      function goTo(y){
        targetScrollY = y;
        if (!isScrolling) requestAnimationFrame(smoothScrollLoop);
      }
      var home = document.getElementById('navHome');
      if (home){
        home.addEventListener('click', function(e){
          e.preventDefault();
          try{ sessionStorage.removeItem('skipWelcomeScreen'); }catch(err){}
          goTo(0);
        });
      }
      var cta = document.getElementById('scrollCta');
      if (cta){
        var TOP_LIMIT = 4;        // px: por debajo de este valor se considera "inicio"
        var ctaVisible = true;    // estado lógico actual
        var ctaBusy = false;      // true mientras se ejecuta el scroll iniciado por el propio CTA
        var ctaCurrent = 1;       // opacidad actual
        var ctaToken = 0;

        function tweenCta(target, dur, done){
          var token = ++ctaToken, from = ctaCurrent, t0 = null;
          (function step(ts){
            if (token !== ctaToken) return;
            if (t0 === null) t0 = ts;
            var k = dur ? Math.min(1, (ts - t0) / dur) : 1;
            var e = k * k * (3 - 2 * k);
            ctaCurrent = from + (target - from) * e;
            cta.style.setProperty('opacity', String(ctaCurrent), 'important');
            if (k < 1){ requestAnimationFrame(step); }
            else if (done){ done(); }
          })(performance.now());
        }

        function hideCta(instant){
          if (!ctaVisible) return;
          ctaVisible = false;
          cta.classList.add('cta-fading');
          tweenCta(0, instant ? 0 : 900, function(){ cta.classList.add('cta-done'); });
        }

        function showCta(){
          if (ctaVisible) return;
          ctaVisible = true;
          cta.classList.remove('cta-done');
          cta.classList.add('cta-fading');
          tweenCta(1, 700, function(){
            cta.style.removeProperty('opacity');
            cta.classList.remove('cta-fading');
          });
        }

        function syncCta(){
          if (ctaBusy) return;
          if (window.scrollY > TOP_LIMIT){ hideCta(); } else { showCta(); }
        }

        window.addEventListener('scroll', syncCta, { passive: true });
        window.addEventListener('pageshow', syncCta);
        if (window.scrollY > TOP_LIMIT){ hideCta(true); }

        cta.addEventListener('click', function(){
          var max = document.documentElement.scrollHeight - window.innerHeight;
          goTo(Math.max(0, max));

          /* Al terminar el scroll actual, el CTA se desvanece y desaparece */
          ctaBusy = true;
          function waitForScrollEnd(){
            if (isScrolling || Math.abs(targetScrollY - currentScrollY) > 0.5){
              requestAnimationFrame(waitForScrollEnd);
              return;
            }
            ctaBusy = false;
            syncCta();
          }
          requestAnimationFrame(function(){ requestAnimationFrame(waitForScrollEnd); });
        });
      }
    })();
  </script>

  <script>
    (function(){
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var layers = document.querySelectorAll('.noche-parallax');
      if (!layers.length) return;
      var ticking = false;
      function apply(){
        var y = window.scrollY || window.pageYOffset || 0;
        layers.forEach(function(el){
          var depth = parseFloat(el.getAttribute('data-depth')) || 0;
          el.style.transform = 'translate3d(0,' + (-(y * depth)).toFixed(1) + 'px,0)';
        });
        ticking = false;
      }
      window.addEventListener('scroll', function(){
        if (!ticking){ requestAnimationFrame(apply); ticking = true; }
      }, { passive:true });
      apply();
    })();
  </script>
</body>
