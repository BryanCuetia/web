<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bryan Cuetia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --bg-soft: #F4F1EA;
    --ink: #15161B;
    --ink-dim: #6E6D72;
    --line: rgba(21,22,27,0.14);
    --accent: #000000;
    --accent-dim: #4A4A4E;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  a{ color:inherit; text-decoration:none; }

  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    height:6px;
    width:100%;
    background:#FFFFFF;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:92vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    overflow:hidden;
    background:#FFFFFF;
  }

  .hero-content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    min-height:92vh;
    width:100%;
    padding:1.1rem clamp(1.15rem, 4vw, 3.2rem) 2rem;
  }

  .name{
    font-family:'Helvetica Neue', sans-serif;
    font-weight:900;
    text-transform:uppercase;
    line-height:1;
    font-size:clamp(1.8rem, 3vw, 2.625rem);
    letter-spacing:0.5px;
    color:#000000;
  }

  .name span{
    display:block;
  }

  .name .accent-letter{
    color:var(--accent);
  }

  .hero-bottom{
    display:flex;
    flex-direction:column;
    gap:1.4rem;
  }

  .socials-mini{
    display:flex;
    gap:1.1rem;
    align-items:center;
  }

  .socials-mini a{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--line);
    border-radius:50%;
    color:var(--ink-dim);
    transition:border-color .25s ease, color .25s ease, transform .25s ease;
  }

  .socials-mini a:hover{
    border-color:var(--accent);
    color:var(--accent);
    transform:translateY(-2px);
  }

  .socials-mini svg{ width:15px; height:15px; }

  /* ---------- INTRO SECTION ---------- */
  .intro{
    padding:6.5rem clamp(1.2rem, 4vw, 3.2rem);
    max-width:760px;
  }

  .eyebrow-line{
    width:48px;
    height:2px;
    background:var(--accent);
    margin-bottom:1.6rem;
  }

  .intro h2{
    font-family:'Archivo Black', sans-serif;
    font-weight:400;
    font-size:clamp(1.6rem, 3.4vw, 2.4rem);
    line-height:1.25;
    margin-bottom:1.2rem;
  }

  .intro p{
    color:var(--ink-dim);
    font-size:1.05rem;
    line-height:1.7;
    max-width:60ch;
  }

  /* ---------- FOOTER ---------- */
  footer{
    background:var(--bg-soft);
    border-top:1px solid var(--line);
    padding:4.5rem clamp(1.2rem, 4vw, 3.2rem) 2.4rem;
  }

  .footer-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:2.5rem;
    padding-bottom:3rem;
    border-bottom:1px solid var(--line);
  }

  .footer-brand{
    font-family:'Archivo Black', sans-serif;
    font-size:1.6rem;
  }

  .footer-brand .accent-letter{ color:var(--accent); }

  .footer-tag{
    color:var(--ink-dim);
    font-size:0.9rem;
    margin-top:0.6rem;
    max-width:32ch;
  }

  .social-list{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
    gap:1.4rem;
    width:100%;
    max-width:820px;
  }

  .social-item{
    display:flex;
    align-items:center;
    gap:0.9rem;
    padding:0.9rem 1rem;
    border:1px solid var(--line);
    border-radius:10px;
    transition:border-color .25s ease, background .25s ease, transform .2s ease;
  }

  .social-item:hover{
    border-color:var(--accent);
    background:rgba(201,138,75,0.06);
    transform:translateY(-2px);
  }

  .social-icon{
    width:38px;
    height:38px;
    flex:0 0 auto;
    border-radius:50%;
    background:rgba(21,22,27,0.05);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
  }

  .social-icon svg{ width:17px; height:17px; }

  .social-text{ display:flex; flex-direction:column; line-height:1.3; }
  .social-platform{ font-size:0.82rem; color:var(--ink-dim); }
  .social-handle{ font-size:0.96rem; font-weight:600; }

  .footer-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:1rem;
    padding-top:2rem;
    font-size:0.82rem;
    color:var(--ink-dim);
  }

  .footer-bottom a{
    color:var(--ink-dim);
    transition:color .2s ease;
  }
  .footer-bottom a:hover{ color:var(--accent); }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 640px){
    .hero{ min-height:78vh; }
    .hero-content{
      min-height:78vh;
      justify-content:flex-start;
      gap:1.3rem;
      padding-top:1.8rem;
      padding-bottom:2.4rem;
      align-items:center;
      text-align:center;
    }
    .name{ font-size:clamp(3rem, 17vw, 4.4rem); letter-spacing:0; }
    .socials-mini{ gap:0.7rem; }
    .socials-mini a{
      width:22px;
      height:22px;
      border:none;
    }
    .socials-mini svg{ width:15px; height:15px; }
    .hero-bottom{ align-items:center; gap:0; }
  }
</style>
</head>
<body>

  <div class="topbar"></div>

  <header class="hero">

    <div class="hero-content">
      <h1 class="name">
        <span>BRYAN</span>
      </h1>

      <div class="hero-bottom">
        <div class="socials-mini" aria-label="Redes sociales">
          <a href="https://instagram.com/bryancuetia" aria-label="Instagram" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
          </a>
          <a href="https://tiktok.com/@bryancuetia" aria-label="TikTok" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.8c-.9-.6-1.5-1.6-1.6-2.8h-3v12.6a2.6 2.6 0 1 1-2.1-2.6v-3a5.6 5.6 0 1 0 5.1 5.6V9.7c1 .7 2.2 1.1 3.6 1.1V7.8c-.7 0-1.4-.2-2-.6z"/></svg>
          </a>
          <a href="https://facebook.com/bryancuetia" aria-label="Facebook" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5h2.5l.4-3h-2.9V8.4c0-.9.2-1.5 1.5-1.5h1.6V4.2C16.3 4.1 15.3 4 14.1 4c-2.4 0-4.1 1.5-4.1 4.2v2.3H7.5v3H10V21h3.5z"/></svg>
          </a>
          <a href="https://x.com/bryancuetia" aria-label="X" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4l7.3 9.6L4.4 20H6l6-6.6L16.8 20H20l-7.6-10L19.7 4H18l-5.5 6L8.4 4H4z"/></svg>
          </a>
          <a href="https://youtube.com/@bryancuetia" aria-label="YouTube" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.4c-.2-.9-.9-1.6-1.8-1.8C18 5.2 12 5.2 12 5.2s-6 0-7.8.4c-.9.2-1.6.9-1.8 1.8C2 9.2 2 12 2 12s0 2.8.4 4.6c.2.9.9 1.6 1.8 1.8 1.8.4 7.8.4 7.8.4s6 0 7.8-.4c.9-.2 1.6-.9 1.8-1.8.4-1.8.4-4.6.4-4.6s0-2.8-.4-4.6zM10 15V9l5.2 3-5.2 3z"/></svg>
          </a>
        </div>
      </div>
    </div>
  </header>

</body>
</html>
